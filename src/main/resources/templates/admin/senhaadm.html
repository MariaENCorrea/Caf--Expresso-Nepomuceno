<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="description" content="Login administrativo - Expresso Nepomuceno">

    <title>Login Administrativo | Expresso Nepomuceno</title>


    <!-- Bootstrap -->
    <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
            rel="stylesheet">


    <!-- Bootstrap Icons -->
    <link
            rel="stylesheet"
            href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">


    <!-- CSS -->
    <link
            rel="stylesheet"
            th:href="@{/css/senhaadm.css}">


    <!-- Favicon -->
    <link
            rel="icon"
            type="image/png"
            th:href="@{/img/favicon.png}">

</head>


<body>

<main class="login-page">


    <!-- =====================================================
         LADO ESQUERDO
    ====================================================== -->

    <section class="login-apresentacao">

        <div class="apresentacao-conteudo">


            <!-- LOGO -->

            <div class="logo-cafe">

                <i class="bi bi-cup-hot-fill"></i>

            </div>


            <!-- NOME DA CAFETERIA -->

            <h1>
                Expresso<br>
                <span>Nepomuceno</span>
            </h1>


            <!-- DESCRIÇÃO -->

            <p>
                Administração da cafeteria
            </p>


            <!-- LINHA -->

            <div class="linha-decorativa"></div>


            <!-- TEXTO -->

            <span class="texto-apresentacao">

                    Gerencie os pedidos e acompanhe
                    o atendimento da cafeteria
                    de forma simples e organizada.

                </span>

        </div>

    </section>



    <!-- =====================================================
         LADO DIREITO
    ====================================================== -->

    <section class="login-area">

        <div class="login-card">


            <!-- ÍCONE -->

            <div class="icone-login">

                <i class="bi bi-person-lock"></i>

            </div>


            <!-- TÍTULO -->

            <h2>
                Área Administrativa
            </h2>


            <!-- DESCRIÇÃO -->

            <p class="descricao">

                Entre com seu usuário e senha
                para acessar o painel.

            </p>



            <!-- =================================================
                 FORMULÁRIO DE LOGIN
            ================================================== -->

            <form
                    id="formLogin"
                    th:action="@{/login-administrativo}"
                    method="post">


                <!-- USUÁRIO -->

                <div class="campo">

                    <label for="usuario">

                        <i class="bi bi-person"></i>

                        Usuário

                    </label>


                    <div class="input-group">

                            <span class="input-group-text">

                                <i class="bi bi-person-fill"></i>

                            </span>


                        <input
                                type="text"
                                id="usuario"
                                name="usuario"
                                class="form-control"
                                placeholder="Digite seu usuário"
                                autocomplete="username"
                                required>

                    </div>

                </div>



                <!-- SENHA -->

                <div class="campo">

                    <label for="senha">

                        <i class="bi bi-lock"></i>

                        Senha

                    </label>


                    <div class="input-group">

                            <span class="input-group-text">

                                <i class="bi bi-lock-fill"></i>

                            </span>


                        <input
                                type="password"
                                id="senha"
                                name="senha"
                                class="form-control"
                                placeholder="Digite sua senha"
                                autocomplete="current-password"
                                required>


                        <!-- MOSTRAR SENHA -->

                        <button
                                type="button"
                                class="btn-visualizar"
                                onclick="mostrarSenha()"
                                aria-label="Mostrar senha">

                            <i
                                    id="iconeSenha"
                                    class="bi bi-eye">
                            </i>

                        </button>

                    </div>

                </div>



                <!-- =================================================
                     MENSAGEM DE ERRO
                ================================================== -->

                <div
                        id="mensagemErro"
                        class="mensagem-erro"
                        th:if="${erro}">

                    <i class="bi bi-exclamation-circle-fill"></i>

                    <span th:text="${erro}">
                            Usuário ou senha incorretos.
                        </span>

                </div>



                <!-- =================================================
                     BOTÃO ENTRAR
                ================================================== -->

                <div class="botao-container">

                    <button
                            type="submit"
                            class="btn-entrar">

                        <i class="bi bi-box-arrow-in-right"></i>

                        <span>
                                Entrar no Administrativo
                            </span>

                    </button>

                </div>


            </form>



            <!-- =================================================
                 SEGURANÇA
            ================================================== -->

            <div class="seguranca">

                <i class="bi bi-shield-lock-fill"></i>

                <span>
                        Área restrita aos gerentes
                    </span>

            </div>



            <!-- =================================================
                 VOLTAR PARA O SITE
            ================================================== -->

            <a
                    th:href="@{/}"
                    class="voltar">

                <i class="bi bi-arrow-left"></i>

                Voltar para o site

            </a>


        </div>

    </section>


</main>



<!-- =========================================================
     JAVASCRIPT
========================================================== -->

<script
        th:src="@{/js/login.js}">
</script>


</body>

</html>
